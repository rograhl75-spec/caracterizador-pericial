name: Monitor da legislação

# Roda todo dia às 07:17 e às 18:43 (Brasília) e também pelo botão "Run workflow" na aba Actions.
# Duas execuções diárias porque os sites do governo às vezes recusam os servidores do GitHub por algumas horas.
on:
  schedule:
    - cron: '17 10 * * *'
    - cron: '43 21 * * *'
  workflow_dispatch:
    inputs:
      teste:
        description: 'Execução de teste: simula um documento novo, abre uma Issue de teste e chama o Claude (não grava alertas)'
        type: boolean
        default: false

permissions:
  contents: write   # gravar dados/alertas.js e scripts/estado.json
  issues: write     # abrir a Issue com as alterações

concurrency:
  group: monitor-legislacao
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEM_CLAUDE: ${{ secrets.ANTHROPIC_API_KEY != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false   # o token de escrita não fica no .git/config durante o npm e o monitor

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'

      # Só instala o SDK do Claude se o segredo ANTHROPIC_API_KEY estiver cadastrado (análise opcional).
      - name: Instalar SDK do Claude
        if: env.TEM_CLAUDE == 'true'
        run: npm ci --prefix scripts --ignore-scripts --no-audit --no-fund   # versões travadas no package-lock.json, sem scripts de instalação

      - name: Verificar fontes oficiais
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/monitor.mjs ${{ inputs.teste && '--teste' || '' }}

      - name: Gravar alertas e estado
        if: ${{ !inputs.teste }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "monitor-legislacao[bot]"
          git config user.email "monitor-legislacao@users.noreply.github.com"
          git add dados/alertas.js scripts/estado.json
          if git diff --cached --quiet; then
            echo "Sem mudanças para gravar."
          else
            git commit -m "Monitor: verificação de $(date -u +%Y-%m-%d)"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
