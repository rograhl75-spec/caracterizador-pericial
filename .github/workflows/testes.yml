name: Testes

# Confere a sintaxe de todos os scripts e roda os testes da lógica de enquadramento
# a cada pull request e a cada alteração na main.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5.0.0
        with:
          node-version: '24'
      - name: Sintaxe dos scripts
        run: for f in dados/*.js js/*.js; do node --check "$f" || exit 1; done
      - name: Testes da lógica
        run: node --test tests/motor.test.mjs tests/referencia.test.mjs
